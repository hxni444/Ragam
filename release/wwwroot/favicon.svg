<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 1080 1080" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
  <defs>
    <linearGardient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e26" />
      <stop offset="50%" stop-color="#0f0f14b" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGardient>
    <linearGardient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#FF5400" />
      <stop offset="100%" stop-color="#E03800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#FF5400" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Black Gradient Background Tile -->
  <rect x="30" y="30" width="1020" height="1020" rx="240" fill="url(#darkBg)" stroke="url(#borderGlow)" stroke-width="16" />

  <!-- The R Glyph with Orange Gradient and Glow -->
  <g filter="url(#glow)" transform="matrix(83.1129,0,0,83.1129,-16036.688467,-32897.432902)">
    <text x="193.324px" y="408.452px" style="font-family:'Nevera-Regular', 'Nevera', sans-serif;font-size:15.347px;font-weight:900;fill:url(#orangeGlow);">R</text>
  </g>
</svg>
