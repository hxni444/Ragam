name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.0.9 or v2.0.9)'
        required: true
        default: '2.0.9'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawVer = "${{ github.event.inputs.version }}"
          } else {
            $rawVer = "${{ github.ref_name }}"
          }
          $cleanVer = $rawVer.TrimStart('v', 'V').Trim()
          $tag = "v$cleanVer"
          Write-Host "Releasing version: $cleanVer with tag: $tag"
          echo "version=$cleanVer" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build UI
        shell: pwsh
        run: |
          Set-Location Ragam.UI
          npm ci
          npm run build
          Set-Location ..

      - name: Prepare wwwroot
        shell: pwsh
        run: |
          if (Test-Path Ragam.App/wwwroot) {
            Remove-Item -Recurse -Force Ragam.App/wwwroot/*
          } else {
            New-Item -ItemType Directory -Path Ragam.App/wwwroot -Force
          }
          Copy-Item -Recurse Ragam.UI/dist/* Ragam.App/wwwroot/

      - name: Publish .NET Application
        shell: pwsh
        run: |
          dotnet publish Ragam.App/Ragam.App.csproj -c Release -r win-x64 --self-contained true -o ./publish /p:Version=${{ steps.get_version.outputs.version }}

      - name: Prepare Release Directory & Download Prior Releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path "./release") {
            Remove-Item -Recurse -Force "./release"
          }
          New-Item -ItemType Directory -Path "./release" -Force

          try {
            vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GITHUB_TOKEN --outputDir "./release"
          } catch {
            Write-Host "Prior release download skipped or not found. Continuing with fresh release."
          }

      - name: Package with Velopack
        shell: pwsh
        run: |
          vpk pack --packId Ragam --packVersion ${{ steps.get_version.outputs.version }} --packDir ./publish --packTitle "RAGAM" --packAuthors "Hani" --icon "Ragam.App/app.ico" --mainExe "Ragam.exe" --releaseNotes "RELEASE_NOTES.md" --runtime win-x64 --outputDir "./release"

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GITHUB_TOKEN --outputDir "./release" --tag "${{ steps.get_version.outputs.tag }}" --releaseName "${{ steps.get_version.outputs.tag }}" --publish
